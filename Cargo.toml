[workspace]
resolver = "3"
members = [
  "crates/arkiv-git-crypto",
  "crates/arkiv-git-core",
  "crates/arkiv-git-store",
  "crates/arkiv-git-sync",
  "crates/arkiv-git-cli",
  "crates/arkiv-git-zk-core",
  "crates/arkiv-git-zk",
]
exclude = ["zk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chayan-bit/arkiv-git"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
