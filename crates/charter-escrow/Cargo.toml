[package]
name = "charter-escrow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-signer-local = "2.5"
charter-core = { path = "../charter-core" }
charter-store = { path = "../charter-store" }
charter-sync = { path = "../charter-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
charter-crypto = { path = "../charter-crypto" }
charter-store = { path = "../charter-store", features = ["fake"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
