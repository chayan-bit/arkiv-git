[package]
name = "arkiv-git-zk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Verify (and, with feature `prove`, produce) RISC Zero receipts for sealed patches"

[lints]
workspace = true

[features]
# Heavy: pulls the RISC Zero prover. Off by default so the CLI only links the verifier.
prove = ["risc0-zkvm/prove"]

[dependencies]
arkiv-git-zk-core = { path = "../arkiv-git-zk-core" }
bincode = "1.3"
# disable-dev-mode: fake (dev-mode) receipts never verify, whatever RISC0_DEV_MODE says.
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "disable-dev-mode"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
