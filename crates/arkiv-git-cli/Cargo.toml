[package]
name = "arkiv-git-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "git-remote-arkiv"
path = "src/bin/git-remote-arkiv.rs"

[[bin]]
name = "arkiv-git"
path = "src/bin/arkiv-git.rs"

[dependencies]
alloy-signer-local = "2.5"
arkiv-git-core = { path = "../arkiv-git-core" }
arkiv-git-program = { path = "../arkiv-git-program" }
arkiv-git-store = { path = "../arkiv-git-store", features = ["fake"] }
arkiv-git-sync = { path = "../arkiv-git-sync", features = ["fake"] }
arkiv-git-timelock = { path = "../arkiv-git-timelock" }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
