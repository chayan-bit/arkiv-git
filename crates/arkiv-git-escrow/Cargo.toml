[package]
name = "arkiv-git-escrow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-signer-local = "2.5"
arkiv-git-core = { path = "../arkiv-git-core" }
arkiv-git-store = { path = "../arkiv-git-store" }
arkiv-git-sync = { path = "../arkiv-git-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
arkiv-git-crypto = { path = "../arkiv-git-crypto" }
arkiv-git-store = { path = "../arkiv-git-store", features = ["fake"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
