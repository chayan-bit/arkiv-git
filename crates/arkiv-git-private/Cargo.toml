[package]
name = "arkiv-git-private"
description = "P2 private repos: MLS (X-Wing) key agreement and sealed Arkiv entities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arkiv-git-core = { path = "../arkiv-git-core" }
arkiv-git-crypto = { path = "../arkiv-git-crypto" }
arkiv-git-store = { path = "../arkiv-git-store" }
arkiv-git-sync = { path = "../arkiv-git-sync" }
# Same pinned node commit as arkiv-git-store: ops are rewritten at the wire level.
arkiv-bindings = { git = "https://github.com/Arkiv-Network/arkiv", rev = "2a3526dd861bf01c284d232d8ea4f880e24fd526" }
arkiv-rpc-types = { git = "https://github.com/Arkiv-Network/arkiv", rev = "2a3526dd861bf01c284d232d8ea4f880e24fd526" }
# OpenMLS main at the P0-gated rev (docs/p0/openmls-xwing.md): 0.9.2 carries RUSTSEC-2026-0331.
openmls = { git = "https://github.com/openmls/openmls", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3", features = ["draft-ietf-mls-pq-ciphersuites", "libcrux-provider"] }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { git = "https://github.com/openmls/openmls", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3", features = ["draft-ietf-mls-pq-ciphersuites"] }
# Same versions OpenMLS's RustCrypto provider already pulls in.
chacha20poly1305 = "0.11"
hmac = "0.13"
sha2 = "0.11"
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
arkiv-git-store = { path = "../arkiv-git-store", features = ["fake"] }
arkiv-git-sync = { path = "../arkiv-git-sync", features = ["fake"] }
alloy-signer-local = "2.5"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
