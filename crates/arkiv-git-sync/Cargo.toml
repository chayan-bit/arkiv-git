[package]
name = "arkiv-git-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# File-persisted MemArkiv backend for driving the binaries from tests (design 8.3).
fake = ["arkiv-git-store/fake"]

[dependencies]
arkiv-git-crypto = { path = "../arkiv-git-crypto" }
arkiv-git-core = { path = "../arkiv-git-core" }
arkiv-git-store = { path = "../arkiv-git-store" }
alloy-signer-local = "2.5"
bs58 = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
minicbor = { version = "2", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
arkiv-git-store = { path = "../arkiv-git-store", features = ["fake"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
