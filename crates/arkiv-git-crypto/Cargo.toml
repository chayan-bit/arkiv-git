[package]
name = "arkiv-git-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = "0.11"
hkdf = "0.13"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha3 = "0.10"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
proptest = "1"
