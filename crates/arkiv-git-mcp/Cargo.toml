[package]
name = "arkiv-git-mcp"
description = "MCP server exposing arkiv-git repos, ops, proofs and escrow to AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "arkiv-git-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std"] }

[dev-dependencies]
tempfile = "3"
