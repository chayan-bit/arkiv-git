[package]
name = "zk-prover"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arkiv-git-zk = { path = "../../crates/arkiv-git-zk" }
bincode = "1.3"
# The prover lives here, outside the root workspace, so CI never builds it.
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "prove"] }
arkiv-git-zk-core = { path = "../../crates/arkiv-git-zk-core" }
getrandom = "0.3"
methods = { path = "../methods" }
serde_json = "1"
